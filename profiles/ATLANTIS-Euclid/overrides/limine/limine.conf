timeout: 3

/Arch Linux
    protocol: linux
    path: boot():/vmlinuz-linux
    cmdline: rd.luks.name=<LUKS-UUID>=root root=/dev/mapper/root rw quiet
    module_path: boot():/initramfs-linux.img

/Arch Linux (fallback)
    protocol: linux
    path: boot():/vmlinuz-linux
    cmdline: rd.luks.name=<LUKS-UUID>=root root=/dev/mapper/root rw
    module_path: boot():/initramfs-linux-fallback.img
